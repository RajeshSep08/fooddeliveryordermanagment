<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h4 mb-1">{{ mode === 'create' ? 'Create Order' : 'Edit Order' }}</h2>
          <p class="text-muted mb-0">Fill in the order details below.</p>
        </div>
        <button type="button" class="btn btn-outline-secondary" (click)="goBack()">Back</button>
      </div>

      <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="customerName">Customer Name</label>
            <input id="customerName" class="form-control" formControlName="customerName" />
            <div class="text-danger small mt-1" *ngIf="isInvalid('customerName')">
              <div *ngFor="let message of getErrorMessages('customerName')">{{ message }}</div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="customerPhone">Customer Phone</label>
            <input id="customerPhone" class="form-control" formControlName="customerPhone" />
            <div class="text-danger small mt-1" *ngIf="isInvalid('customerPhone')">
              <div *ngFor="let message of getErrorMessages('customerPhone')">{{ message }}</div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="foodItem">Food Item</label>
            <input id="foodItem" class="form-control" formControlName="foodItem" />
            <div class="text-danger small mt-1" *ngIf="isInvalid('foodItem')">
              <div *ngFor="let message of getErrorMessages('foodItem')">{{ message }}</div>
            </div>
          </div>

          <div class="col-md-3">
            <label class="form-label" for="quantity">Quantity</label>
            <input id="quantity" type="number" min="1" class="form-control" formControlName="quantity" />
            <div class="text-danger small mt-1" *ngIf="isInvalid('quantity')">
              <div *ngFor="let message of getErrorMessages('quantity')">{{ message }}</div>
            </div>
          </div>

          <div class="col-md-3">
            <label class="form-label" for="price">Price</label>
            <input id="price" type="number" min="0" class="form-control" formControlName="price" />
            <div class="text-danger small mt-1" *ngIf="isInvalid('price')">
              <div *ngFor="let message of getErrorMessages('price')">{{ message }}</div>
            </div>
          </div>

          <div class="col-12">
            <label class="form-label" for="deliveryAddress">Delivery Address</label>
            <textarea id="deliveryAddress" class="form-control" rows="3" formControlName="deliveryAddress"></textarea>
            <div class="text-danger small mt-1" *ngIf="isInvalid('deliveryAddress')">
              <div *ngFor="let message of getErrorMessages('deliveryAddress')">{{ message }}</div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select" formControlName="status">
              <option *ngFor="let status of orderStatuses" [value]="status">{{ status }}</option>
            </select>
            <div class="text-danger small mt-1" *ngIf="isInvalid('status')">
              <div *ngFor="let message of getErrorMessages('status')">{{ message }}</div>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="orderDate">Order Date</label>
            <input id="orderDate" type="date" class="form-control" formControlName="orderDate" />
            <div class="text-danger small mt-1" *ngIf="isInvalid('orderDate')">
              <div *ngFor="let message of getErrorMessages('orderDate')">{{ message }}</div>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Saving...' : (mode === 'create' ? 'Create Order' : 'Save Changes') }}
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="goBack()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
